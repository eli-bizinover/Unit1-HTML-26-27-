<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Practice</title>
</head>
<body>

<h1>Game Stats</h1>


<table border="1">
    <caption>Squad Stats - Last Match</caption>
    <th>Role</th>
    <th>Player</th>
    <th>Kills</th>
    <th>Deaths</th>
    <th>Assists</th>
    <tr>
        <th rowspan="3">Starting</th>
        <td>Player A</td>
        <td>10</td>
        <td>2</td>
        <td>5</td>
    </tr>
    <tr>
        <td>Player B</td>
        <td>8</td>
        <td>3</td>
        <td>4</td>
    </tr>
    <tr>
        <td>Player C</td>
        <td>6</td>
        <td>4</td>
        <td>7</td>
    </tr>
    <tr>
        <th rowspan="2">Bench</th>
        <td>Player D</td>
        <td>3</td>
        <td>5</td>
        <td>7</td>
    </tr>
    <tr>
        <td>Player E</td>
        <td>2</td>
        <td>6</td>
        <td>1</td>
    </tr>
    <tr>
        <th>Team Total</th>
        <td colspan="5">29 kills, 20 deaths, 19 assits 29 </td>
    </tr>
    <tr>
        <td colspan="5">Stats from match on Oct 12. Starters led in kills; bench provided support.</td>
    
  
    </tr>
</table>












    
</body>
</html>
